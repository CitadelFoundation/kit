name: Publish Kit Publishing

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout distribution repo
        uses: actions/checkout@v6

      - name: Guard release branch
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            release/kit-publishing-*)
              ;;
            *)
              echo "::error::Publishing is restricted to release/kit-publishing-* branches."
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm 11 toolchain
        shell: bash
        run: |
          npm --version
          npm --version | grep -E '^11(\.|$)'

      - name: Verify existing package
        run: npm view @citadelfoundation/kit-publishing version

      - name: Verify public distribution tree
        shell: bash
        run: |
          test -f README.md
          test -f docs/release-workflow.md
          test -f packages/publishing/package.json
          test -f packages/publishing/README.md
          test -f packages/publishing/dist/bin.js
          test -f packages/publishing/dist/catalog.js
          test -f packages/publishing/dist/index.js
          test -f packages/publishing/dist/index.d.ts
          test -f packages/publishing/dist/templates/blank/kit-publishing.template.json
          test -f packages/publishing/dist/templates/starter/kit-publishing.template.json
          test -f packages/publishing/dist/templates/publication/kit-publishing.template.json

      - name: Publish package
        working-directory: packages/publishing
        run: npm publish --access public
